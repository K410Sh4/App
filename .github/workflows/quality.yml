name: Qualidade do cardápio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validar código e imagens
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes estáticos
        run: node scripts/check-site.mjs
      - name: Validar SVGs como XML
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = glob.glob('assets/products/*.svg')
          assert len(paths) == 20, f'Esperadas 20 imagens; encontradas {len(paths)}'
          for p in paths:
              ET.parse(p)
          print(f'PASS: {len(paths)} SVGs bem formados')
          PY
